[package]
name = "oni-tui"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "ONI terminal UI — supervise agent tasks without leaving the terminal"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
crossterm = "0.28"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
